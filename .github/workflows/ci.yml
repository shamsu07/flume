name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable ".[dev]"
      - run: ruff check .
      - run: mypy src/flume
      - name: Tests and coverage
        run: >-
          pytest
          --cov=flume
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build pip pip-audit
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: flume --help
      - run: flume-benchmark --help
      - run: pip-audit
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: flume:ci
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: flume:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
