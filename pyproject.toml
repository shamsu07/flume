[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flume-rag-cache"
version = "0.2.0"
description = "RAG cache compiler and vLLM serving proxy for cache-stable long-context inference."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "sqlalchemy>=2.0.29",
  "greenlet>=3.0.3",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "transformers>=4.41.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.11.0",
  "pip-audit>=2.7.3",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.4",
]

[project.scripts]
flume = "flume.cli:main"
flume-benchmark = "flume.benchmark_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "skip"
no_implicit_optional = true
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["flume"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
