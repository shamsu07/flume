[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flume-rag-cache"
version = "0.1.0"
description = "RAG cache compiler and vLLM serving proxy for cache-stable long-context inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "sqlalchemy>=2.0.29",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "transformers>=4.41.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.4",
]

[project.scripts]
flume = "flume.cli:main"
flume-benchmark = "flume.benchmark_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
